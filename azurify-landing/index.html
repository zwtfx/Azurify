<!DOCTYPE html>
<html>
<head>
  <title>VOID - Login</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  
    .box {
      text-align: center;
      width: 90%;
      max-width: 400px;
      padding: 20px;
    }
  
    input {
      width: 90%;
      max-width: 300px;
      background: black;
      border: 1px solid #444;
      color: white;
      padding: 10px;
      margin: 5px 0;
      font-family: monospace;
      font-size: 16px;
      box-sizing: border-box;
    }
  
    button {
      background: black;
      border: 1px solid white;
      color: white;
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
    }
  
    button:hover {
      background: white;
      color: black;
    }
  
    h2 {
      font-size: 1.5em;
    }
  
    p {
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>VOID - Public Internet Project by Obfuuscated</h2>
    <input id="username" placeholder="username"><br>
    <input id="password" type="password" placeholder="password"><br>
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
    <p id="msg"></p>
  </div>

<script>
async function login() {
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: username.value,
      password: password.value
    })
  });

  const data = await res.json();

  if (data.success) {
    localStorage.setItem("user", username.value);
    window.location.href = "/void.html";
  } else {
    msg.innerText = "Invalid login.";
  }
}

async function register() {
  const res = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: username.value,
      password: password.value
    })
  });

  const data = await res.json();

  if (data.success) {
    msg.innerText = "Registered. You can login.";
  } else {
    msg.innerText = data.error;
  }
}
</script>
</body>
</html>
