<!DOCTYPE html>
<html>
<head>
    <title>Void</title>
    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: monospace;
        }

        textarea {
            width: 100vw;
            height: 100vh;
            background: black;
            color: white;
            border: none;
            outline: none;
            resize: none;
            padding: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<textarea id="void" placeholder="write..."></textarea>

<script>
    const area = document.getElementById("void");

    // Load saved text
    area.value = localStorage.getItem("voidText") || "";

    // Save while typing
    area.addEventListener("input", () => {
        localStorage.setItem("voidText", area.value);
    });
</script>

</body>
</html>
